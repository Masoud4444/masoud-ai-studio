name: Continuity timeline regression
on:
  push:
    branches: ["main", "implementation/**"]
    paths:
      - "backend/app/continuity.py"
      - "backend/app/timeline.py"
      - "backend/tests/test_continuity_timeline.py"
      - "requirements.txt"
      - "pyproject.toml"
  pull_request:
    paths:
      - "backend/app/continuity.py"
      - "backend/app/timeline.py"
      - "backend/tests/test_continuity_timeline.py"
      - "requirements.txt"
      - "pyproject.toml"
concurrency:
  group: continuity-${{ github.ref }}
  cancel-in-progress: false
jobs:
  continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Test continuity chronology analysis
        run: pytest backend/tests/test_continuity_timeline.py
