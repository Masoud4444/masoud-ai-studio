name: Execution task result retrieval regression
on:
  push:
    branches: [implementation/bootstrap-001]
    paths:
      - "backend/app/api.py"
      - "backend/tests/test_execution_api_routes.py"
      - ".github/workflows/execution-task-api-regression.yml"
permissions:
  contents: read
jobs:
  execution-task-result-retrieval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Run only the focused execution API route and result retrieval regression
        run: python -m pytest backend/tests/test_execution_api_routes.py -q
