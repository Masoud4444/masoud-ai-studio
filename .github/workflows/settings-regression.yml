name: Settings diagnostics regression
on:
  push:
    branches: [implementation/bootstrap-001]
    paths:
      - "backend/app/api.py"
      - "backend/tests/test_settings_diagnostics.py"
      - ".github/workflows/settings-regression.yml"
  pull_request:
    paths:
      - "backend/app/api.py"
      - "backend/tests/test_settings_diagnostics.py"
      - ".github/workflows/settings-regression.yml"
permissions:
  contents: read
jobs:
  settings-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: pytest -q backend/tests/test_settings_diagnostics.py
