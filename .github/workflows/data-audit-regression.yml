name: Data audit and migration regression

on:
  push:
    branches: [implementation/bootstrap-001]
    paths:
      - "desktop/data_audit.py"
      - "desktop/migrate_data.py"
      - "backend/tests/test_data_audit.py"
      - "backend/tests/test_data_migration.py"
      - ".github/workflows/data-audit-regression.yml"
  workflow_dispatch:

jobs:
  local-data-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused test dependency
        run: python -m pip install "pytest>=8,<9"
      - name: Run focused local data safety regressions
        run: python -m pytest backend/tests/test_data_audit.py backend/tests/test_data_migration.py -q
