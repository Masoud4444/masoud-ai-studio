name: Story screenplay export regression

on:
  push:
    branches: [implementation/bootstrap-001]
    paths:
      - "backend/app/story_export.py"
      - "backend/tests/test_story_export.py"
      - ".github/workflows/story-export-regression.yml"

permissions:
  contents: read

jobs:
  screenplay-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run focused screenplay export regression
        run: |
          python -m pip install pytest
          python -m pytest backend/tests/test_story_export.py -q
