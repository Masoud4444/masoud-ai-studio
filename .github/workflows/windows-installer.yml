name: Windows installer

on:
  push:
    branches: ["implementation/**"]
    paths:
      - "backend/**"
      - "frontend/**"
      - "desktop/**"
      - "installer/**"
      - "requirements-runtime.txt"
      - "alembic.ini"
      - ".github/workflows/windows-installer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build
      - name: Install runtime and packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-runtime.txt
          python -m pip install "pyinstaller>=6.10,<7.0"
      - name: Build self-contained application directory
        run: pyinstaller --noconfirm --clean desktop/MasoudAIStudio.spec
      - name: Build isolated PDF/DOCX parser helper
        run: pyinstaller --noconfirm --clean --distpath dist/MasoudAIStudio --workpath build/document-parser desktop/DocumentParser.spec
      - name: Smoke-test isolated document parser
        shell: pwsh
        run: |
          python -c "from docx import Document; d=Document(); d.add_paragraph('Masoud AI Studio parser smoke check'); d.save('parser-smoke.docx')"
          $output = & "dist/MasoudAIStudio/MasoudDocumentParser.exe" "parser-smoke.docx" "docx"
          if ($LASTEXITCODE -ne 0) { throw "Document parser helper failed with exit code $LASTEXITCODE" }
          $result = $output | ConvertFrom-Json
          if ($result.chunks.Count -lt 1) { throw "Document parser returned no extracted chunks" }
      - name: Smoke-test packaged application and migrations
        shell: pwsh
        run: |
          $app = Resolve-Path "dist/MasoudAIStudio/MasoudAIStudio.exe"
          $process = Start-Process -FilePath $app -ArgumentList "--smoke-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Packaged application smoke test failed with exit code $($process.ExitCode)" }
      - name: Build offline backup restore utility
        run: pyinstaller --noconfirm --clean --onefile --console --name MasoudStudioRestore --paths . --distpath dist/MasoudAIStudio --workpath build/restore-tool desktop/restore_backup.py
      - name: Build offline data migration utility
        run: pyinstaller --noconfirm --clean --onefile --console --name MasoudStudioMigrate --distpath dist/MasoudAIStudio --workpath build/data-migration desktop/migrate_data.py
      - name: Add offline data management launchers to installer payload
        shell: pwsh
        run: |
          Copy-Item "scripts/restore-backup-windows.bat" "dist/MasoudAIStudio/restore-backup-windows.bat"
          Copy-Item "scripts/migrate-data-windows.bat" "dist/MasoudAIStudio/migrate-data-windows.bat"
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build Windows installer
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\masoud-ai-studio.iss'
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Masoud-AI-Studio-Windows-x64
          path: installer/output/*.exe
          if-no-files-found: error
          retention-days: 30
