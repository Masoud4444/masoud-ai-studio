name: Restore configuration regression

on:
  push:
    branches: [implementation/bootstrap-001]
    paths:
      - "desktop/restore_backup.py"
      - ".github/workflows/restore-configuration-regression.yml"

permissions:
  contents: read

jobs:
  restore-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate restore configuration safely
        run: |
          python - <<'PY'
          import importlib.util
          import json
          import tempfile
          from pathlib import Path

          spec = importlib.util.spec_from_file_location("restore_backup", "desktop/restore_backup.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          with tempfile.TemporaryDirectory() as temp:
              root = Path(temp) / "profile"
              root.mkdir()
              assert module._configured_data_directory(root) == root / "data"

              settings = root / "desktop-settings.json"
              settings.write_text(json.dumps({"data_directory": str(root / "moved")}), encoding="utf-8")
              assert module._configured_data_directory(root) == root / "moved"

              for invalid in ("{broken", json.dumps(["not", "an", "object"]), json.dumps({"data_directory": 123}), json.dumps({"data_directory": ""})):
                  settings.write_text(invalid, encoding="utf-8")
                  try:
                      module._configured_data_directory(root)
                  except ValueError:
                      pass
                  else:
                      raise AssertionError("Invalid settings were accepted")

              settings.unlink()
              linked = root / "linked"
              linked.symlink_to(root, target_is_directory=True)
              assert module._contains_symlink(linked / "child")
          PY
