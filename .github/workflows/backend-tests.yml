name: Backend tests
on:
  push:
    branches: ["main", "implementation/**"]
    paths:
      - "backend/migrations/**"
      - "requirements.txt"
      - "alembic.ini"
      - "pyproject.toml"
  pull_request:
    paths:
      - "backend/migrations/**"
      - "requirements.txt"
      - "alembic.ini"
      - "pyproject.toml"
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Verify Alembic bootstrap migration
        run: |
          mkdir -p data
          MASOUD_STUDIO_DATABASE_URL=sqlite:///./data/ci_migrations.db alembic upgrade head
      - run: pytest
