name: Backup preferences regression
on:
  push:
    branches: ["implementation/**"]
    paths:
      - "backend/app/api.py"
      - "backend/tests/test_settings_preferences.py"
      - ".github/workflows/settings-preferences-regression.yml"
  pull_request:
    paths:
      - "backend/app/api.py"
      - "backend/tests/test_settings_preferences.py"
      - ".github/workflows/settings-preferences-regression.yml"
permissions:
  contents: read
jobs:
  preferences:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: pytest -q backend/tests/test_settings_preferences.py
