name: Execution routing regression
on:
  push:
    branches: [implementation/bootstrap-001]
    paths:
      - "backend/app/execution_policy.py"
      - "backend/app/cloud_executor.py"
      - "backend/app/task_manager.py"
      - "backend/app/task_schemas.py"
      - "backend/app/worker.py"
      - "backend/app/main.py"
      - "backend/app/api.py"
      - "backend/app/orchestrator.py"
      - "backend/app/orchestrator_schemas.py"
      - "backend/tests/test_execution_policy.py"
      - "backend/tests/test_execution_jobs.py"
      - "backend/tests/test_execution_orchestration.py"
      - "frontend/src/WorkspacePanels.tsx"
      - "frontend/src/App.tsx"
      - ".github/workflows/execution-routing-regression.yml"
permissions:
  contents: read
jobs:
  execution-routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Run only new execution-routing regressions
        run: python -m pytest backend/tests/test_execution_policy.py backend/tests/test_execution_jobs.py backend/tests/test_execution_orchestration.py -q
