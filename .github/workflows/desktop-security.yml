name: Desktop security regression tests

on:
  push:
    branches: ["implementation/**"]
    paths:
      - "backend/app/main.py"
      - "backend/tests/test_desktop_security.py"
      - ".github/workflows/desktop-security.yml"
  pull_request:
    paths:
      - "backend/app/main.py"
      - "backend/tests/test_desktop_security.py"
      - ".github/workflows/desktop-security.yml"

permissions:
  contents: read

jobs:
  desktop-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Run only the new desktop security regression tests
        run: pytest -q backend/tests/test_desktop_security.py
