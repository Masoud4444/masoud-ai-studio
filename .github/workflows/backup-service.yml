name: Backup service regression tests

on:
  push:
    branches: ["implementation/**"]
    paths:
      - "backend/app/backup.py"
      - "backend/tests/test_backup_service.py"
      - ".github/workflows/backup-service.yml"
  pull_request:
    paths:
      - "backend/app/backup.py"
      - "backend/tests/test_backup_service.py"
      - ".github/workflows/backup-service.yml"

permissions:
  contents: read

jobs:
  backup-service:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Run only new backup service regressions
        run: pytest -q backend/tests/test_backup_service.py
